version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: subscription_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscription_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: subscription_backend
    restart: always
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/subscription_db?schema=public
      JWT_SECRET: super-secret-key-signature-token-12345
      NODE_ENV: production
    ports:
      - "5001:5001"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subscription_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
